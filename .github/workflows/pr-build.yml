name: PR build

# Builds and tests every pull request (including Dependabot updates), so a dependency bump
# that breaks the build shows a red check before it is merged.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # The executable flag is lost when files are uploaded from Windows or through the website.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew :shared:test

      - name: Build debug APKs
        run: ./gradlew :mobile:assembleDebug :wear:assembleDebug
