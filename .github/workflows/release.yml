name: Build and release

# Publishes a new GitHub release with both APKs whenever app code or build config changes on main.
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "wear/**"
      - "shared/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The executable flag is lost when files are uploaded from Windows or through the website.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew :shared:test

      # Optional: with these secrets set, every release is signed with your own key, so new
      # versions install over old ones. Without them the build is signed with a throwaway key.
      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret. APKs are signed with a temporary key; uninstall the old version before installing a new release."
          fi

      - name: Build APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :mobile:assembleRelease :wear:assembleRelease

      - name: Collect APKs
        run: |
          mkdir dist
          cp mobile/build/outputs/apk/release/mobile-release.apk "dist/PaceWise-phone-$VERSION_NAME.apk"
          cp wear/build/outputs/apk/release/wear-release.apk "dist/PaceWise-watch-$VERSION_NAME.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_NAME" dist/*.apk \
            --target "$GITHUB_SHA" \
            --title "PaceWise $VERSION_NAME" \
            --generate-notes
